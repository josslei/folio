# Folio factory configuration. Paths are resolved for the current OS user.
schema_version = 1

[general.normal_storage]
use_default_location = true
# To use a custom location, set the flag to false and provide an absolute path.
# path = "/absolute/custom/normal"

[general.vault_storage]
use_default_location = true
# Resolving this location does not initialize Vault.
# path = "/absolute/custom/vault"

[diagnostics]
log_level = "warn"

[performance]
# Concurrent Catalog queries and authoritative reads; mutations remain sequential. Must be a positive integer.
access_workers = 4

[ipc]
# Logical sessions, accepted requests, and maximum-size buffered exchanges.
backend_sessions = 64
backend_requests = 32
backend_buffered_requests = 4
# Per-session notification counts. Overflow terminates the affected session.
frontend_push_queue_capacity = 256
backend_push_queue_capacity = 256
# Send plus receipt ACK deadline; not UI processing or an idle-wait timeout.
push_ack_timeout_ms = 30000
